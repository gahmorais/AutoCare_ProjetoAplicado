name: Setup Android
description: >-
  JDK 17 e cache do Gradle. O app nao depende de nenhum arquivo nao versionado
  para compilar: sem Firebase nem Cloudinary, nao ha secret no build de debug.

runs:
  using: composite
  steps:
    - name: Configura o JDK 17
      # AGP 8.x nao roda em JDK menor que 17, e o bytecode do app agora e 17.
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Configura o Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # So o push na branch principal grava o cache; os PRs leem o que ele
        # deixou, em vez de cada um escrever o seu.
        cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
