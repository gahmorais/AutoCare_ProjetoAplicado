plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
}

// Assinatura e versao da release vem do ambiente, nao do git: a chave nao pode ser
// versionada e a workflow de release deriva a versao da tag. Sem essas variaveis
// (build local) o comportamento e o de antes - versao 1/1.0 e APK nao assinado.
def releaseKeystore = System.getenv('RELEASE_KEYSTORE_PATH')
def releaseVersionCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
def releaseVersionName = System.getenv('VERSION_NAME') ?: '1.0'

// IDs do AdMob. O debug usa sempre os IDs de teste oficiais do Google. A release
// assinada (a unica que pode ser publicada) exige os IDs reais do ambiente e
// falha sem eles ou com um ID de teste: publicar com ID de teste nao gera receita,
// e sem ID o SDK derruba o app na abertura. A release sem keystore (portao de
// release local) segue com os de teste, porque nao e publicavel.
def admobTestPublisher = 'ca-app-pub-3940256099942544'
def admobTestIds = [
    app         : "${admobTestPublisher}~3347511713",
    banner      : "${admobTestPublisher}/9214589741",
    interstitial: "${admobTestPublisher}/1033173712",
]
def admobReleaseIds = admobTestIds
if (releaseKeystore) {
    def envNames = [app: 'ADMOB_APP_ID', banner: 'ADMOB_BANNER_ID', interstitial: 'ADMOB_INTERSTITIAL_ID']
    def missing = envNames.values().findAll { !System.getenv(it)?.trim() }
    if (missing) {
        throw new GradleException("Release assinada sem ${missing.join(', ')}. Ver a secao CI/CD no README.")
    }
    admobReleaseIds = envNames.collectEntries { key, name -> [key, System.getenv(name).trim()] }
    def testIds = envNames.findAll { key, name -> admobReleaseIds[key].startsWith(admobTestPublisher) }.values()
    if (testIds) {
        throw new GradleException("Release assinada com ID de teste do AdMob em ${testIds.join(', ')}.")
    }
}
// Politica de privacidade, aberta por Perfil -> Sobre. Tem de ser a mesma URL
// cadastrada no Play Console. A pagina vive no site da GeA Software (repositorio
// gahmorais/geasoftware), no mesmo dominio que serve o app-ads.txt. Sem barra no
// final: e a URL canonica (com barra o site redireciona).
def privacyPolicyUrl = 'https://geasoftware.com.br/autocare/privacidade'
// Debug sem anuncios, para as capturas de tela da loja: ./gradlew installDebug -PsemAnuncios=true
def adsEnabledInDebug = !(findProperty('semAnuncios') ?: 'false').toBoolean()
// Formulario de consentimento como se o aparelho estivesse no EEE, so no debug:
// ./gradlew installDebug -PumpDebugEea=true [-PumpTestDeviceId=<hash do logcat>]
def umpDebugEea = (findProperty('umpDebugEea') ?: 'false').toBoolean()
def umpTestDeviceId = findProperty('umpTestDeviceId') ?: ''

android {
    namespace 'br.com.geasoftware.autocare'
    compileSdk 36

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId "br.com.geasoftware.autocare"
        minSdk 28
        // Minimo exigido pela Play para upload novo (36 desde agosto de 2026).
        targetSdk 36
        versionCode releaseVersionCode
        versionName releaseVersionName
        buildConfigField 'String', 'PRIVACY_POLICY_URL', "\"${privacyPolicyUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: admobTestIds.app]
            buildConfigField 'String', 'ADMOB_BANNER_ID', "\"${admobTestIds.banner}\""
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', "\"${admobTestIds.interstitial}\""
            buildConfigField 'boolean', 'UMP_DEBUG_EEA', "${umpDebugEea}"
            buildConfigField 'String', 'UMP_TEST_DEVICE_ID', "\"${umpTestDeviceId}\""
            buildConfigField 'boolean', 'ADS_ENABLED', "${adsEnabledInDebug}"
        }
        release {
            manifestPlaceholders = [admobAppId: admobReleaseIds.app]
            buildConfigField 'String', 'ADMOB_BANNER_ID', "\"${admobReleaseIds.banner}\""
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', "\"${admobReleaseIds.interstitial}\""
            buildConfigField 'boolean', 'UMP_DEBUG_EEA', 'false'
            buildConfigField 'String', 'UMP_TEST_DEVICE_ID', '""'
            buildConfigField 'boolean', 'ADS_ENABLED', 'true'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseKeystore ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // Esquema exportado a cada versao do banco e versionado no git: e o que
    // permite escrever e testar migracoes quando o modelo mudar.
    room {
        schemaDirectory "$projectDir/schemas"
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // Regras que teriam apontado bugs reais deste projeto: activity exportada
        // sem necessidade, permissao usada sem estar declarada no manifesto,
        // alarme exato sem verificacao no Android 14 e coroutine/estado mal usado
        // no Compose.
        fatal 'ExportedActivity',
                'ExportedReceiver',
                'ExportedService',
                'ExportedContentProvider',
                'MissingPermission',
                'ScheduleExactAlarm',
                'UnsafeProtectedBroadcastReceiver',
                'ProtectedPermissions',
                'ComposableNaming',
                'ProduceStateDoesNotAssignValue',
                'CoroutineCreationDuringComposition',
                'FlowOperatorInvokedInComposition',
                'UnrememberedMutableState'
        // 21 recursos sem uso tinham se acumulado (icones antigos, strings da
        // versao com Firebase). Como erro, a lista nao volta a crescer.
        error 'UnusedResources'
    }
}

dependencies {

    //Room - persistencia local de perfis, veiculos e manutencoes
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    //DataStore - perfil ativo e preferencias leves
    implementation 'androidx.datastore:datastore-preferences:1.1.7'

    //Orientacao EXIF das fotos antes de recodificar em JPEG
    implementation 'androidx.exifinterface:exifinterface:1.4.1'

    //Image Crop
    implementation("com.vanniktech:android-image-cropper:4.5.0")
    //Image Load Async
    implementation("io.coil-kt:coil-compose:2.4.0")

    //Koin
    implementation "io.insert-koin:koin-android:$koin_version"
    //koinViewModel() nos destinos do NavHost: sem ele o ViewModel ficaria fora
    //do ViewModelStore do destino e o estado se perderia na rotacao.
    implementation "io.insert-koin:koin-androidx-compose:$koin_compose_version"

    //Navegacao
    implementation "androidx.navigation:navigation-compose:$navigation_version"

    //Anuncios (AdMob) e consentimento (UMP). O SDK traz as proprias regras do R8.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    //WorkManager - reagendamento das notificacoes apos o reboot
    implementation "androidx.work:work-runtime-ktx:2.10.5"

    //MAterial Dialog Compose
    implementation "io.github.vanpra.compose-material-dialogs:core:$material_dialog_version"
    implementation "io.github.vanpra.compose-material-dialogs:datetime:$material_dialog_version"

    implementation 'androidx.core:core-ktx:1.17.0'
    //Splash: resolve a sessao antes de desenhar, para o login nao piscar
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.activity:activity-compose:1.11.0'

    // BOM alinha ui/foundation/material3 numa combinacao testada entre si. Vale
    // tambem para teste e tooling: fora dela eles ficavam presos no 1.3.3 enquanto
    // o app rodava 1.4.3.
    def composeBom = platform("androidx.compose:compose-bom:$compose_bom_version")
    implementation composeBom
    androidTestImplementation composeBom
    debugImplementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // Material 2 permanece so por causa do compose-material-dialogs (datepicker),
    // que e construido sobre M2. Nenhum codigo nosso deve importar material.*
    implementation 'androidx.compose.material:material'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    // Uri e abstrata e Uri.parse e stub no android.jar de teste: sem um mock nao
    // ha como atravessar as assinaturas que recebem Uri.
    testImplementation 'org.mockito:mockito-core:4.11.0'
    // Implementacao real de org.json no classpath de teste: a do android.jar e
    // um stub que devolve valores default e faria o parser passar sem testar nada.
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}

// Fora do bloco android: o kotlinOptions de la foi descontinuado no Kotlin 2.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
