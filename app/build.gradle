plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'kotlin-parcelize'
}

// cloud_name e upload preset do Cloudinary. Nao sao segredos no sentido estrito
// (o cloud_name aparece em toda URL de imagem e o preset e extraivel do APK),
// mas ficam fora do git assim mesmo. Ver a secao "Imagens" no README.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'br.com.gabrielmorais.autocare'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.gabrielmorais.autocare"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField "String", "CLOUDINARY_CLOUD_NAME",
                "\"${localProperties.getProperty('cloudinary.cloudName', '')}\""
        buildConfigField "String", "CLOUDINARY_UPLOAD_PRESET",
                "\"${localProperties.getProperty('cloudinary.uploadPreset', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.2'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // Regras que teriam apontado bugs reais deste projeto: activity exportada
        // sem necessidade, permissao usada sem estar declarada no manifesto,
        // alarme exato sem verificacao no Android 14 e coroutine/estado mal usado
        // no Compose.
        fatal 'ExportedActivity',
                'ExportedReceiver',
                'ExportedService',
                'ExportedContentProvider',
                'MissingPermission',
                'ScheduleExactAlarm',
                'UnsafeProtectedBroadcastReceiver',
                'ProtectedPermissions',
                'ComposableNaming',
                'ProduceStateDoesNotAssignValue',
                'CoroutineCreationDuringComposition',
                'FlowOperatorInvokedInComposition',
                'UnrememberedMutableState'
    }
}

dependencies {

    //Firebase Dependecies
    implementation platform('com.google.firebase:firebase-bom:32.1.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-database-ktx'

    //Image Crop
    implementation("com.vanniktech:android-image-cropper:4.5.0")
    //Image Load Async
    implementation("io.coil-kt:coil-compose:2.4.0")

    //Koin
    implementation "io.insert-koin:koin-android:$koin_version"
    //koinViewModel() nos destinos do NavHost: sem ele o ViewModel ficaria fora
    //do ViewModelStore do destino e o estado se perderia na rotacao.
    implementation "io.insert-koin:koin-androidx-compose:$koin_compose_version"

    //Navegacao
    implementation "androidx.navigation:navigation-compose:$navigation_version"

    //WorkManager - reagendamento das notificacoes apos o reboot
    implementation "androidx.work:work-runtime-ktx:2.8.1"

    //OkHttp - upload de imagens para o Cloudinary. Declarado explicitamente e nao
    //herdado transitivamente do Coil.
    implementation "com.squareup.okhttp3:okhttp:4.11.0"

    //MAterial Dialog Compose
    implementation "io.github.vanpra.compose-material-dialogs:core:$material_dialog_version"
    implementation "io.github.vanpra.compose-material-dialogs:datetime:$material_dialog_version"

    implementation 'androidx.core:core-ktx:1.10.1'
    //Splash: resolve a sessao antes de desenhar, para o login nao piscar
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.activity:activity-compose:1.7.2'

    // BOM alinha ui/foundation/material3 numa combinacao testada entre si. Esta
    // versao e a que casa com o kotlinCompilerExtensionVersion 1.4.2 / Kotlin 1.8.10.
    implementation platform('androidx.compose:compose-bom:2023.06.01')
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // Material 2 permanece so por causa do compose-material-dialogs (datepicker),
    // que e construido sobre M2. Nenhum codigo nosso deve importar material.*
    implementation 'androidx.compose.material:material'
    implementation 'com.google.firebase:firebase-messaging-ktx:23.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.11.0'
    // Uri e abstrata e Uri.parse e stub no android.jar de teste: sem um mock nao
    // ha como atravessar as assinaturas que recebem Uri.
    testImplementation 'org.mockito:mockito-core:4.11.0'
    // Implementacao real de org.json no classpath de teste: a do android.jar e
    // um stub que devolve valores default e faria o parser passar sem testar nada.
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_ui_version"
}