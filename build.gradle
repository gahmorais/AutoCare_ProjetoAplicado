buildscript {

    ext {
        // Kotlin, compilador do Compose e BOM andam juntos: cada versao do
        // compilador aceita exatamente uma versao do Kotlin. Ao subir um, confira
        // a tabela em developer.android.com/jetpack/androidx/releases/compose-kotlin
        // e mantenha o plugin org.jetbrains.kotlin.android abaixo na mesma versao.
        kotlin_version = '1.9.24'
        compose_compiler_version = '1.5.14'
        compose_bom_version = '2024.06.00'
        koin_version = '3.4.2'
        koin_compose_version = '3.4.6'
        // 2.7+ e o que aceita enter/exitTransition no NavHost.
        navigation_version = '2.7.7'
        material_dialog_version = "0.8.1-rc"
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.3.15'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
    repositories {
        mavenCentral()
    }
}// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.3.2' apply false
    id 'com.android.library' version '8.3.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}

