buildscript {

    ext {
        // Desde o Kotlin 2.0 o compilador do Compose e um plugin do proprio
        // Kotlin e sai na mesma versao dele: basta manter kotlin_version e os
        // plugins abaixo alinhados. A BOM do Compose fica independente.
        kotlin_version = '2.2.21'
        compose_bom_version = '2025.10.01'
        koin_version = '3.4.2'
        koin_compose_version = '3.4.6'
        // 2.7+ e o que aceita enter/exitTransition no NavHost.
        navigation_version = '2.9.5'
        material_dialog_version = "0.8.1-rc"
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
    repositories {
        mavenCentral()
    }
}// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'com.android.library' version '8.13.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
}

